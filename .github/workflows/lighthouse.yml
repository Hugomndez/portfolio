name: Lighthouse Tests

on:
  repository_dispatch:
    types:
      - vercel.deployment.ready

run-name: Lighthouse Tests on ${{ github.event.client_payload.project.name }} deployment (${{ github.event.client_payload.environment }})

permissions:
  contents: read
  pull-requests: write

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Notify Vercel
        uses: vercel/repository-dispatch/actions/status@v1
        with:
          name: 'GitHub Action - ${{ github.event.client_payload.project.name }}: lighthouse tests'

      - name: Find pull request for deployment commit
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.payload.client_payload.git.sha;
            const { data: pullRequests } =
              await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: sha,
              });
            const pr =
              pullRequests.find((pullRequest) => pullRequest.state === 'open') ??
              pullRequests[0];
            if (!pr) {
              core.notice(
                `No pull request found for commit ${sha} (direct push). Skipping Lighthouse comment.`,
              );
              core.setOutput('found', 'false');
              return;
            }
            core.notice(`Found PR #${pr.number} for commit ${sha}.`);
            core.setOutput('found', 'true');
            core.setOutput('reviews-url', `${pr.url}/reviews`);

      - name: Run Lighthouse Tests
        uses: foo-software/lighthouse-check-action@master
        id: lighthouseCheck
        with:
          urls: ${{ github.event.client_payload.url }}
          device: 'all'
          gitHubAccessToken: ${{ secrets.GITHUB_TOKEN }}
          prCommentEnabled: true
          commentUrl: ${{ steps.pr.outputs.reviews-url }}

      - name: Verify Lighthouse Check results
        uses: foo-software/lighthouse-check-status-action@master
        with:
          lighthouseCheckResults: ${{ steps.lighthouseCheck.outputs.lighthouseCheckResults }}
          minAccessibilityScore: '90'
          minBestPracticesScore: '90'
          minPerformanceScore: '50'
          minSeoScore: '90'
