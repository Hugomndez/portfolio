name: End to End Tests

on:
  repository_dispatch:
    types:
      - 'vercel.deployment.ready'

run-name: E2E Tests on ${{ github.event.client_payload.project.name }} deployment (${{ github.event.client_payload.environment }})

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 'Notify Vercel'
        uses: 'vercel/repository-dispatch/actions/status@v1'
        with:
          name: 'GitHub Action - portfolio: e2e tests'

      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install pnpm | node.js
        uses: pnpm/setup@v3
        with:
          cache: true
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          require-lockfile: true

      - name: Install Playwright Browsers
        run: |
          pnpm exec playwright install chromium --only-shell
          sudo apt-get update
          sudo apt-get install -y libnss3 libatk-bridge2.0-0 libdrm2 libxcomposite1 libxdamage1 libxrandr2 libgbm1

      - name: Run Playwright Tests
        run: pnpm test:e2e
        env:
          BASE_URL: ${{ github.event.client_payload.url }}

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: tests/reports/
          retention-days: 30
