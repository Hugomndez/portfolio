name: End to End Tests

on:
  repository_dispatch:
    types:
      - vercel.deployment.ready

run-name: E2E Tests on ${{ github.event.client_payload.project.name }} deployment (${{ github.event.client_payload.environment }})

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Notify Vercel
        uses: vercel/repository-dispatch/actions/status@v1
        with:
          name: 'GitHub Action - portfolio: e2e tests'

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm | node.js
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: true
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          require-lockfile: true

      - name: Install Playwright Browsers
        run: |
          pnpm exec playwright install chromium --only-shell
          sudo apt-get update
          sudo apt-get install -y libnss3 libatk-bridge2.0-0 libdrm2 libxcomposite1 libxdamage1 libxrandr2 libgbm1

      - name: Run Playwright Tests
        run: pnpm test:e2e
        env:
          BASE_URL: ${{ github.event.client_payload.url }}

      - name: Upload Playwright Report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: tests/reports/
          retention-days: 30
