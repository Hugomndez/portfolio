nodeVersion: 24.22.1
engineStrict: true
saveTypes: true
saveExact: true

autoDedupe: true
dedupePeers: true
resolvePeersFromWorkspaceRoot: true

lockfile:
  includeResolutionSettings: true

trustPolicy: no-downgrade
trustPolicyExclude:
  - semver@6.3.1

update:
  githubActions: true
  ignoreDeps:
    - typescript # Ignore updates for TypeScript until v7 supports JS API

overrides:
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
